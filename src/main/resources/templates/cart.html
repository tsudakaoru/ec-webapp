<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17382d">
  <title>カート | ECサイト</title>
  <link rel="stylesheet" th:href="@{/css/products.css}">
</head>
<body>
  <header class="site-header"><div class="header-inner">
    <a class="brand" th:href="@{/products}" aria-label="ECサイト 商品一覧"><span class="brand-mark" aria-hidden="true">e</span><span>ECサイト</span></a>
    <a class="cart-link" th:href="@{/cart}" th:attr="aria-label=|カートを見る。現在${cartCount}点|"><span>カートを見る</span><span class="cart-count" th:text="${cartCount}">0</span></a>
  </div></header>
  <main class="page-shell">
    <div class="page-intro"><div><p class="eyebrow">YOUR SELECTION · 02</p><h1 id="page-title">カート</h1></div><p class="item-total"><strong th:text="${#numbers.formatInteger(cartCount, 2)}">00</strong> ITEMS</p></div>
    <div class="empty-state" th:if="${cartItems.isEmpty()}">
      <h2>カートは空です</h2><p>商品一覧から気になる商品をお選びください。</p>
      <a class="button button-primary" th:href="@{/products}">商品一覧へ戻る</a>
    </div>
    <div th:unless="${cartItems.isEmpty()}">
      <div class="cart-list">
        <article class="cart-row" th:each="item : ${cartItems}">
          <a class="cart-product-image" th:href="@{/products/{productId}(productId=${item.product.productId})}"><img th:src="${item.product.imageUrl}" th:alt="${item.product.name}"></a>
          <div class="cart-product-info">
            <h2><a th:href="@{/products/{productId}(productId=${item.product.productId})}" th:text="${item.product.name}">商品名</a></h2>
            <p th:text="${item.product.description}">商品説明</p>
            <strong th:text="|¥${#numbers.formatDecimal(item.product.price, 1, 'COMMA', 0, 'POINT')}|">¥0</strong>
          </div>
          <form class="quantity-form" th:action="@{/cart/items/{productId}/update(productId=${item.product.productId})}" method="post">
            <label th:for="|quantity-${item.product.productId}|">数量</label>
            <input type="number" name="quantity" min="1" th:max="${item.product.stock}" th:value="${item.quantity}" th:id="|quantity-${item.product.productId}|" required>
            <button class="button button-secondary" type="submit">数量を更新</button>
          </form>
          <div class="cart-subtotal"><span>小計</span><strong th:text="|¥${#numbers.formatDecimal(item.subtotal, 1, 'COMMA', 0, 'POINT')}|">¥0</strong></div>
          <form th:action="@{/cart/items/{productId}/delete(productId=${item.product.productId})}" method="post"><button class="text-button" type="submit">削除</button></form>
        </article>
      </div>
      <div class="cart-summary"><span>合計</span><strong th:text="|¥${#numbers.formatDecimal(cartTotal, 1, 'COMMA', 0, 'POINT')}|">¥0</strong></div>
      <div class="flow-actions"><a class="button button-secondary" th:href="@{/products}">買い物を続ける</a><a class="button button-primary" th:href="@{/orders/confirm}">注文手続きへ</a></div>
    </div>
  </main>
</body>
</html>
