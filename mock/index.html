<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f1">
  <title>商品一覧 | ECサイト</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1e2925;
      --muted: #6a736e;
      --paper: #edf0ec;
      --surface: #fffefa;
      --line: #d9dfd9;
      --green: #244a3c;
      --green-dark: #17382d;
      --lime: #c4a66b;
      --coral: #a85d4a;
      --shadow: 0 16px 38px rgb(27 43 35 / 8%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, transparent 49.94%, rgb(36 74 60 / 2.5%) 50%, transparent 50.06%),
        radial-gradient(ellipse at 80% 4%, rgb(196 166 107 / 11%), transparent 27rem),
        linear-gradient(180deg, #f7f8f4 0, var(--paper) 42rem);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    .site-header {
      height: 82px;
      border-bottom: 1px solid rgb(196 166 107 / 42%);
      background: var(--green-dark);
      color: #f8f6ef;
    }

    .header-inner,
    .page-shell {
      width: min(1160px, calc(100% - 48px));
      margin-inline: auto;
    }

    .header-inner {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      font-family: Georgia, "Yu Mincho", serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .brand-mark {
      width: 33px;
      height: 33px;
      display: grid;
      place-items: center;
      color: var(--lime);
      border: 1px solid rgb(196 166 107 / 76%);
      border-radius: 50%;
      font-family: Georgia, serif;
      font-size: 18px;
      font-style: italic;
    }

    .cart-link {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 14px;
      border: 1px solid rgb(196 166 107 / 68%);
      border-radius: 2px;
      background: transparent;
      color: #f8f6ef;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .cart-link:hover { border-color: var(--lime); background: rgb(255 255 255 / 7%); transform: translateY(-1px); }
    .cart-link svg { width: 18px; height: 18px; }

    .cart-count {
      min-width: 21px;
      height: 21px;
      display: inline-grid;
      place-items: center;
      padding-inline: 5px;
      border-radius: 50%;
      background: var(--lime);
      color: var(--green-dark);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    main { padding: 56px 0 76px; }

    .page-intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #8a7042;
      font-family: Georgia, "Yu Mincho", serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Yu Mincho", serif;
      font-size: clamp(34px, 4vw, 42px);
      font-weight: 500;
      line-height: 1.2;
    }

    .item-total {
      margin: 0 2px 4px 0;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .item-total strong {
      margin-right: 4px;
      color: var(--ink);
      font-family: Georgia, serif;
      font-size: 22px;
      font-weight: 500;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .product-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid #dce1dc;
      border-radius: 2px;
      background: var(--surface);
      box-shadow: var(--shadow);
      animation: arrive 500ms both;
    }

    .product-card:nth-child(2) { animation-delay: 70ms; }
    .product-card:nth-child(3) { animation-delay: 140ms; }

    .product-visual {
      position: relative;
      aspect-ratio: 1.2 / 1;
      overflow: hidden;
      background: #e6e9e5;
    }

    .product-visual img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 350ms ease;
    }

    .product-card:hover .product-visual img { transform: scale(1.035); }

    .stock-tag {
      position: absolute;
      top: 14px;
      left: 14px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid rgb(255 255 255 / 75%);
      border-radius: 3px;
      background: rgb(23 56 45 / 92%);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }

    .stock-tag::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--lime);
      content: "";
    }

    .stock-tag.out { color: #fff; }
    .stock-tag.out::before { background: var(--coral); }

    .product-info { padding: 20px 20px 18px; }

    .product-name {
      min-height: 27px;
      margin: 0 0 6px;
      font-size: 17px;
      font-weight: 650;
      line-height: 1.5;
    }

    .product-price {
      margin: 0 0 20px;
      font-family: Georgia, "Yu Mincho", serif;
      font-size: 26px;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    .product-price small {
      margin-left: 3px;
      color: var(--muted);
      font-family: "Aptos", "Yu Gothic UI", "Meiryo", sans-serif;
      font-size: 11px;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1.18fr;
      gap: 8px;
    }

    .button {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      border: 1px solid transparent;
      border-radius: 2px;
      font: inherit;
      font-size: 12px;
      font-weight: 750;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: color 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .button-secondary { border-color: #cfd7d0; background: transparent; color: var(--ink); }
    .button-secondary:hover { border-color: var(--green); color: var(--green-dark); }
    .button-primary { background: var(--green); color: #fff; }
    .button-primary:hover { background: var(--green-dark); }
    .button-primary:disabled { background: #e7e9e5; color: #737b75; cursor: not-allowed; }
    .button:focus-visible, .cart-link:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; }

    .page-note {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 24px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }

    .page-note span:last-child { color: #8a7042; font-weight: 700; }

    .toast {
      position: fixed;
      z-index: 2;
      right: 24px;
      bottom: 24px;
      max-width: calc(100vw - 32px);
      padding: 13px 17px;
      border: 1px solid #426f53;
      border-radius: 2px;
      background: var(--green-dark);
      color: #fff;
      box-shadow: 0 10px 30px rgb(22 46 30 / 20%);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.is-visible { opacity: 1; transform: translateY(0); }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {
      .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .product-info { padding: 15px 14px 14px; }
      .card-actions { grid-template-columns: 1fr; }
      .button { min-height: 40px; }
    }

    @media (max-width: 520px) {
      .header-inner, .page-shell { width: min(100% - 32px, 420px); }
      .site-header { height: 66px; }
      .brand { font-size: 17px; }
      .cart-link { min-height: 40px; padding-inline: 10px; font-size: 12px; }
      main { padding-top: 34px; }
      .page-intro { margin-bottom: 20px; }
      .product-grid { grid-template-columns: 1fr; gap: 14px; }
      .product-card { display: grid; grid-template-columns: 42% minmax(0, 1fr); }
      .product-visual { height: 100%; min-height: 205px; aspect-ratio: auto; }
      .stock-tag { top: 9px; left: 8px; min-height: 25px; padding-inline: 7px; font-size: 10px; }
      .product-info { display: flex; flex-direction: column; justify-content: center; padding: 14px 12px; }
      .product-name { font-size: 15px; }
      .product-price { margin-bottom: 12px; font-size: 21px; }
      .button { font-size: 11px; }
      .page-note { align-items: flex-start; flex-direction: column; gap: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./index.html" aria-label="ECサイト ホーム">
        <span class="brand-mark" aria-hidden="true">e</span>
        <span>ECサイト</span>
      </a>
      <a class="cart-link" href="#cart" aria-label="カートを見る。現在0点">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h8.5a2 2 0 0 0 1.9-1.4L21 8H6" />
          <circle cx="10" cy="20" r="1" />
          <circle cx="18" cy="20" r="1" />
        </svg>
        <span>カートを見る</span>
        <span class="cart-count" aria-live="polite">0</span>
      </a>
    </div>
  </header>

  <main class="page-shell">
    <section aria-labelledby="page-title">
      <div class="page-intro">
        <div>
          <p class="eyebrow">THE EXECUTIVE SELECTION · 01</p>
          <h1 id="page-title">商品一覧</h1>
        </div>
        <p class="item-total"><strong>03</strong> ITEMS</p>
      </div>

      <div class="product-grid">
        <article class="product-card" data-product="ワイヤレスイヤホン">
          <div class="product-visual">
            <img src="../src/main/resources/static/images/products/1.png" alt="白い充電ケースとワイヤレスイヤホン" width="1536" height="1024">
            <span class="stock-tag">在庫あり</span>
          </div>
          <div class="product-info">
            <h2 class="product-name">ワイヤレスイヤホン</h2>
            <p class="product-price">¥5,980<small>税込</small></p>
            <div class="card-actions">
              <button class="button button-secondary" type="button">詳細を見る</button>
              <button class="button button-primary add-to-cart" type="button">カートに追加</button>
            </div>
          </div>
        </article>

        <article class="product-card" data-product="ゲーミングマウス">
          <div class="product-visual">
            <img src="../src/main/resources/static/images/products/2.png" alt="RGBライティング付きの黒いゲーミングマウス" width="1536" height="1024">
            <span class="stock-tag">在庫あり</span>
          </div>
          <div class="product-info">
            <h2 class="product-name">ゲーミングマウス</h2>
            <p class="product-price">¥3,980<small>税込</small></p>
            <div class="card-actions">
              <button class="button button-secondary" type="button">詳細を見る</button>
              <button class="button button-primary add-to-cart" type="button">カートに追加</button>
            </div>
          </div>
        </article>

        <article class="product-card" data-product="USB-Cハブ">
          <div class="product-visual">
            <img src="../src/main/resources/static/images/products/3.png" alt="複数ポートを備えたシルバーのUSB-Cハブ" width="1536" height="1024">
            <span class="stock-tag out">在庫なし</span>
          </div>
          <div class="product-info">
            <h2 class="product-name">USB-Cハブ</h2>
            <p class="product-price">¥2,980<small>税込</small></p>
            <div class="card-actions">
              <button class="button button-secondary" type="button">詳細を見る</button>
              <button class="button button-primary add-to-cart" type="button" disabled>在庫なし</button>
            </div>
          </div>
        </article>
      </div>

      <div class="page-note">
        <span>表示中の商品 3点</span>
        <span>仕事道具にも、選ぶ理由を。</span>
      </div>
    </section>
  </main>

  <div class="toast" role="status" aria-live="polite"></div>

  <script>
    const cartCount = document.querySelector(".cart-count");
    const cartLink = document.querySelector(".cart-link");
    const toast = document.querySelector(".toast");
    let toastTimer;
    let addedCount = 0;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("is-visible");
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 2400);
    }

    document.querySelectorAll(".add-to-cart").forEach((button) => {
      button.addEventListener("click", () => {
        const product = button.closest(".product-card").dataset.product;
        addedCount += 1;
        cartCount.textContent = String(addedCount);
        cartLink.setAttribute("aria-label", `カートを見る。現在${addedCount}点`);
        button.textContent = "追加済み";
        button.disabled = true;
        showToast(`${product}を1点カートに追加しました`);
      });
    });

    cartLink.addEventListener("click", (event) => {
      event.preventDefault();
      showToast(addedCount ? `カートに${addedCount}点入っています` : "カートは空です");
    });
  </script>
</body>
</html>
